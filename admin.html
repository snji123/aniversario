<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entradas · Administrador</title>
<style>
:root{--bg:#EDF1F4;--ink:#16202B;--mut:#5B6875;--card:#fff;--line:#D5DCE3;--ok:#0F766E;--early:#1D4ED8;--late:#B45309;--none:#B42318}
@media(prefers-color-scheme:dark){:root{--bg:#10171E;--ink:#E8EDF2;--mut:#93A1AE;--card:#18222C;--line:#2A3745;--ok:#3CC5B5;--early:#7FA8FF;--late:#F5A04B;--none:#FF8A7A}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px 90px}
.wrap{max-width:720px;margin:0 auto}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;display:flex;gap:6px}
nav button{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--line)}
nav button.on{background:var(--ok);border-color:var(--ok);color:#fff}
h2{font-size:26px;margin:0}h3{font-size:17px;margin:0;text-transform:capitalize}h4{margin:0 0 10px;font-size:16px}
.sub{color:var(--mut);font-size:14px;text-transform:capitalize;margin:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
input,select,button{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{cursor:pointer;background:var(--ok);border-color:var(--ok);color:#fff}
button.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:600;font-size:13px}
td.s{font-weight:600}
.e{color:var(--early)}.p{color:var(--ok)}.r{color:var(--late)}.f{color:var(--none)}
.res{color:var(--mut);font-size:14px;margin:4px 0 8px}
.big{display:block;width:100%;margin:2px 0 14px}
.emp{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.emp:last-child{border-bottom:0}
.emp span{flex:1;font-size:17px}.emp input{flex:1}
.ic{padding:7px 10px;background:var(--card);color:var(--ink);border-color:var(--line)}
.chips button{background:var(--card);color:var(--ink);border-color:var(--line);padding:6px 12px;font-size:14px;border-radius:99px}
#up{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;padding:0;border-radius:50%;font-size:20px;opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .35s,transform .35s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#up.show{opacity:.9;transform:none;pointer-events:auto}
#up:hover{opacity:1;transform:translateY(-2px)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#up{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav id="tabs">
    <button data-v="hoy" class="on">Hoy</button>
    <button data-v="buscar">Buscar</button>
    <button data-v="equipo">Equipo</button>
  </nav>

  <section id="v-hoy">
    <div id="hoy"></div>
    <button class="sec big" id="ant">Días anteriores</button>
    <div id="prev"></div>
    <div class="row" id="ctrl" hidden style="justify-content:center;margin-bottom:14px">
      <button id="mas">+ 3 días más</button><button class="sec" id="menos">− Ver menos</button>
    </div>
  </section>

  <section id="v-buscar" hidden>
    <div class="card">
      <h4>Buscar por fecha</h4>
      <div class="chips row" style="margin-bottom:12px">
        <button data-r="hoy">Hoy</button><button data-r="ayer">Ayer</button><button data-r="sem">Últimos 7 días</button><button data-r="mes">Este mes</button>
      </div>
      <div class="row">
        <label>Desde <input type="date" id="sD"></label>
        <label>Hasta <input type="date" id="sH"></label>
      </div>
      <div class="row" style="margin-top:10px">
        <label>Persona <select id="sE"></select></label>
        <button id="bB">Buscar</button>
      </div>
      <p class="res" id="sMsg">Elige un día, o un rango con "Hasta". Máximo 62 días.</p>
    </div>
    <div id="sRes"></div>
  </section>

  <section id="v-equipo" hidden>
    <div class="card">
      <h4>Horario</h4>
      <div class="row">
        <label>Hora de entrada <input id="cHora" type="time" value="16:00"></label>
        <label>Tolerancia (min) <input id="cTol" type="number" min="0" value="10" style="width:80px"></label>
        <button id="cG">Guardar</button><span id="cMsg" class="p"></span>
      </div>
      <p class="res">El horario nuevo se aplica también a los días anteriores.</p>
    </div>
    <div class="card">
      <h4>Empleados</h4>
      <div id="lista"></div>
      <div class="row" style="margin-top:12px"><input id="nuevo" placeholder="Nombre del nuevo empleado" maxlength="20" style="flex:1"><button id="add">+ Agregar</button></div>
    </div>
  </section>
</div>
<button id="up" aria-label="Volver arriba">↑</button>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,query,where,onSnapshot,getDocs,doc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCqkijkSqL9OBXpO5OSbfKD4zkpSEBlwsE",authDomain:"registro-ad110.firebaseapp.com",projectId:"registro-ad110",storageBucket:"registro-ad110.firebasestorage.app",messagingSenderId:"586318994815",appId:"1:586318994815:web:f466ab4703944b2fd38e4a"
});
const db=getFirestore(app),CONF=doc(db,"config","horario");
const $=id=>document.getElementById(id);
const DEF=[["axel","Axel"],["dani","Dani"],["liz","Liz"],["eric","Eric"],["alan","Alan"]].map(([id,nombre])=>({id,nombre}));
let CFG={hora:"16:00",tol:10,equipo:DEF};
let regs=[],SHOWN=0,unsub=null,cur="",editId=null;

const key=i=>{const d=new Date();d.setDate(d.getDate()-i);return d.toLocaleDateString("sv")};
const atras=k=>Math.round((new Date(key(0)+"T12:00:00")-new Date(k+"T12:00:00"))/864e5);
const fecha=k=>new Date(k+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
const hora=d=>d.toLocaleTimeString("es-MX",{hour12:true});
const fmt=s=>{const a=Math.abs(s),m=Math.floor(a/60),r=a%60;return (m?m+" min ":"")+r+" s"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nombreDe=r=>(CFG.equipo.find(e=>e.id===r.empleadoId)||{}).nombre||r.nombre;

function estado(r,k){
  const diff=Math.round((r.ts.toMillis()-new Date(k+"T"+CFG.hora+":00").getTime())/1000);
  if(diff<0)return {c:"e",t:"Temprano",sg:"−",diff};
  if(diff<=CFG.tol*60)return {c:"p",t:"Puntual",sg:"+",diff};
  return {c:"r",t:"Retardo",sg:"+",diff};
}

function bloque(k,rs,eq="todos"){
  const i=atras(k),n={e:0,p:0,r:0};
  rs=rs.filter(r=>eq==="todos"||r.empleadoId===eq).sort((a,b)=>a.ts.toMillis()-b.ts.toMillis());
  const filas=rs.map((r,j)=>{
    const s=estado(r,k);n[s.c]++;
    return `<tr><td>${j+1}</td><td>${esc(nombreDe(r))}</td><td>${hora(r.ts.toDate())}</td><td class="s ${s.c}">${s.t}</td><td>${s.sg}${fmt(s.diff)}</td></tr>`;
  }).join("");
  const vistos=new Set(rs.map(r=>r.empleadoId));
  const falta=CFG.equipo.filter(e=>!vistos.has(e.id)&&(eq==="todos"||e.id===eq));
  const faltan=falta.map(e=>`<tr><td>–</td><td>${esc(e.nombre)}</td><td>–</td><td class="s f">${i===0?"Pendiente":"Sin registro"}</td><td>–</td></tr>`).join("");
  const tabla=`<div class="tw"><table><thead><tr><th>#</th><th>Nombre</th><th>Hora</th><th>Estado</th><th>Diferencia</th></tr></thead><tbody>${filas}${faltan}</tbody></table></div>`;
  const cab=i===0
    ?`<h2>Hoy</h2><div class="sub">${fecha(k)}</div><div class="stats"><div class="stat e"><b>${n.e}</b>Tempranos</div><div class="stat p"><b>${n.p}</b>Puntuales</div><div class="stat r"><b>${n.r}</b>Retardos</div><div class="stat f"><b>${falta.length}</b>Pendientes</div></div>`
    :`<h3>${i===1?"Ayer":i===2?"Anteayer":fecha(k).split(",")[0]}</h3><div class="sub" style="margin-bottom:6px">${fecha(k)}</div><div class="res">${n.e} tempranos · ${n.p} puntuales · ${n.r} retardos · ${falta.length} sin registro</div>`;
  return `<div class="card">${cab}${tabla}</div>`;
}

/* ---------- HOY + días anteriores ---------- */
function pinta(){
  const por={};regs.forEach(r=>(por[r.fecha]=por[r.fecha]||[]).push(r));
  $("hoy").innerHTML=bloque(key(0),por[key(0)]||[]);
  let h="";for(let i=1;i<=SHOWN;i++)h+=bloque(key(i),por[key(i)]||[]);
  $("prev").innerHTML=h;
  $("ant").hidden=SHOWN>0;$("ctrl").hidden=SHOWN===0;
}
function escucha(){
  unsub&&unsub();cur=key(0);
  unsub=onSnapshot(query(collection(db,"registros"),where("fecha",">=",key(SHOWN))),s=>{
    regs=s.docs.map(d=>d.data()).filter(r=>r.ts);pinta();
  });
}
setInterval(()=>{if(key(0)!==cur)escucha()},30000);
$("ant").onclick=()=>{SHOWN=3;escucha()};
$("mas").onclick=()=>{SHOWN+=3;escucha()};
$("menos").onclick=()=>{SHOWN=Math.max(0,SHOWN-3);escucha()};

/* ---------- Menú ---------- */
$("tabs").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["hoy","buscar","equipo"].forEach(v=>$("v-"+v).hidden=v!==b.dataset.v);
  scrollTo({top:0});
};
$("up").onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("scroll",()=>$("up").classList.toggle("show",scrollY>350),{passive:true});

/* ---------- Buscar ---------- */
const sumDias=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return d.toLocaleDateString("sv")};
document.querySelector(".chips").onclick=e=>{
  const r=e.target.dataset.r;if(!r)return;
  const h=key(0);
  if(r==="hoy")$("sD").value=$("sH").value=h;
  if(r==="ayer")$("sD").value=$("sH").value=key(1);
  if(r==="sem"){$("sD").value=key(6);$("sH").value=h}
  if(r==="mes"){$("sD").value=h.slice(0,8)+"01";$("sH").value=h}
  buscar();
};
$("bB").onclick=buscar;
async function buscar(){
  let d=$("sD").value,h=$("sH").value||d;
  if(!d)return $("sMsg").textContent="Elige una fecha primero.";
  if(h<d)[d,h]=[h,d];
  if(h>key(0))h=key(0);
  if(d>h)return $("sMsg").textContent="Esa fecha todavía no llega.";
  const n=Math.round((new Date(h+"T12:00:00")-new Date(d+"T12:00:00"))/864e5)+1;
  if(n>62)return $("sMsg").textContent="El máximo es 62 días. Acorta el rango.";
  $("sMsg").textContent="Buscando…";
  try{
    const s=await getDocs(query(collection(db,"registros"),where("fecha",">=",d),where("fecha","<=",h)));
    const por={};s.docs.map(x=>x.data()).filter(r=>r.ts).forEach(r=>(por[r.fecha]=por[r.fecha]||[]).push(r));
    let out="";for(let k=h;k>=d;k=sumDias(k,-1))out+=bloque(k,por[k]||[],$("sE").value);
    $("sRes").innerHTML=out;$("sMsg").textContent=`${n} ${n===1?"día":"días"} encontrados.`;
  }catch(e){$("sMsg").textContent="No se pudo buscar. Intenta de nuevo."}
}
function llenaSel(){
  const v=$("sE").value;
  $("sE").innerHTML=`<option value="todos">Todos</option>`+CFG.equipo.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join("");
  $("sE").value=CFG.equipo.some(e=>e.id===v)?v:"todos";
}

/* ---------- Equipo ---------- */
const guarda=datos=>setDoc(CONF,{hora:CFG.hora,tol:CFG.tol,equipo:CFG.equipo,...datos});
function pintaEq(){
  $("lista").innerHTML=CFG.equipo.map(e=>editId===e.id
    ?`<div class="emp"><input id="ed-${e.id}" value="${esc(e.nombre)}" maxlength="20"><button class="ic" data-a="ok" data-id="${e.id}" aria-label="Guardar">✓</button><button class="ic" data-a="no" aria-label="Cancelar">✕</button></div>`
    :`<div class="emp"><span>${esc(e.nombre)}</span><button class="ic" data-a="ed" data-id="${e.id}" aria-label="Editar">✏️</button><button class="ic" data-a="del" data-id="${e.id}" aria-label="Eliminar">🗑️</button></div>`
  ).join("")||`<p class="res">Aún no hay empleados.</p>`;
  const i=editId&&$("ed-"+editId);if(i){i.focus();i.onkeydown=ev=>{if(ev.key==="Enter")$("lista").querySelector('[data-a="ok"]').click()}}
}
$("lista").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=b.dataset.id,a=b.dataset.a;
  if(a==="ed"){editId=id;pintaEq()}
  if(a==="no"){editId=null;pintaEq()}
  if(a==="ok"){
    const v=$("ed-"+id).value.trim();editId=null;
    if(v)await guarda({equipo:CFG.equipo.map(x=>x.id===id?{...x,nombre:v}:x)});else pintaEq();
  }
  if(a==="del"){
    const x=CFG.equipo.find(x=>x.id===id);
    if(confirm(`¿Eliminar a ${x.nombre}? Sus registros anteriores se conservan.`))await guarda({equipo:CFG.equipo.filter(x=>x.id!==id)});
  }
};
$("add").onclick=async()=>{
  const v=$("nuevo").value.trim();if(!v)return;
  await guarda({equipo:[...CFG.equipo,{id:"e"+Date.now().toString(36),nombre:v}]});
  $("nuevo").value="";
};
$("nuevo").onkeydown=e=>{if(e.key==="Enter")$("add").click()};
$("cG").onclick=async()=>{
  try{await guarda({hora:$("cHora").value||"16:00",tol:Math.max(0,+$("cTol").value||0)});$("cMsg").textContent="Guardado"}
  catch(e){$("cMsg").textContent="No se pudo guardar"}
  setTimeout(()=>$("cMsg").textContent="",3000);
};
function formH(){
  if(document.activeElement===$("cHora")||document.activeElement===$("cTol"))return;
  $("cHora").value=CFG.hora;$("cTol").value=CFG.tol;
}
onSnapshot(CONF,s=>{
  if(s.exists()){
    const d=s.data();let eq=d.equipo;
    if(!Array.isArray(eq))eq=DEF.map(x=>({id:x.id,nombre:(d.nombres&&d.nombres[x.id])||x.nombre}));
    CFG={hora:d.hora||CFG.hora,tol:d.tol??CFG.tol,equipo:eq};
  }
  formH();pintaEq();llenaSel();pinta();
});
$("sD").value=$("sH").value="";
escucha();
</script>
</body>
</html>
